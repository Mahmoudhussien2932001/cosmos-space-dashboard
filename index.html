<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>What's For Dinner</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>

    <header class="main-header">
      <div class="container custom-container">
        <div class="header-wrapper">
          <div class="brand">
            <div class="brand-icon">
              <i class="fa-solid fa-utensils"></i>
            </div>

            <div class="brand-text">
              <h2>What's For Dinner</h2>
              <p>Your daily meal inspiration</p>
            </div>
          </div>

          <div class="header-actions desktop-header-actions">
            <button class="header-btn" type="button">
              <i class="fa-solid fa-bookmark"></i>
            </button>

            <button class="header-btn" type="button">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </button>

            <button class="header-btn" type="button">
              <i class="fa-solid fa-gear"></i>
            </button>

            <div class="profile-avatar">
              <img src="image/Mahmoud.jpg" alt="Profile" />
            </div>
          </div>

          <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            type="button"
            aria-label="Open menu"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>

        <div class="mobile-menu" id="mobileMenu">
          <div class="mobile-menu-divider"></div>

          <div class="mobile-menu-links">
            <div class="mobile-menu-item">
              <span class="mobile-menu-icon">
                <i class="fa-solid fa-bookmark"></i>
              </span>

              <span> Saved Recipes </span>
            </div>

            <div class="mobile-menu-item">
              <span class="mobile-menu-icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
              </span>

              <span> Recent </span>
            </div>

            <div class="mobile-menu-item">
              <span class="mobile-menu-icon">
                <i class="fa-solid fa-gear"></i>
              </span>

              <span> Settings </span>
            </div>

            <div class="mobile-menu-item profile-menu-item">
              <div class="mobile-profile-image">
                <img src="image/Mahmoud.jpg" alt="Profile" />
              </div>

              <span> Profile </span>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main-page">
      <div class="container custom-container">
        <section class="recipe-card">
          <div class="row g-0">

            <div class="col-lg-5">
              <div class="recipe-image-wrapper">

                <img id="recipeImage" class="recipe-image" src="" alt="" />


                <div class="rating-box">
                  <span class="rating-star"> ★ </span>

                  <strong id="ratingValue"> 4.9 </strong>

                  <span id="reviewCount"> (187 reviews) </span>
                </div>


                <div class="recipe-meta">

                  <div class="meta-item">
                    <div class="meta-icon prep-icon">◷</div>

                    <span> Prep Time </span>

                    <strong id="prepTime"> 10 min </strong>
                  </div>


                  <div class="meta-item">
                    <div class="meta-icon cook-icon">♨</div>

                    <span> Cook Time </span>

                    <strong id="cookTime"> 15 min </strong>
                  </div>


                  <div class="meta-item">
                    <div class="meta-icon serving-icon">👥</div>

                    <span> Servings </span>

                    <strong id="servings"> 2 people </strong>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-7">
              <div class="recipe-content">
                <div class="recipe-content-top">
    
                  <div class="recipe-heading">
                    <div class="heading-main">

                      <div class="recipe-badges">
                        <span
                          class="recipe-badge difficulty-badge"
                          id="difficultyBadge"
                        >
                          Easy
                        </span>

                        <span
                          class="recipe-badge category-badge"
                          id="categoryBadge"
                        >
                          Seafood
                        </span>
                      </div>

                      <h1 id="recipeTitle">Honey Garlic Salmon</h1>

                      <p id="recipeSubtitle">
                        Pan-seared salmon with a sweet and savory glaze
                      </p>
                    </div>
                    <div class="recipe-actions">
                      <button class="recipe-action-btn" type="button">
                        🔖
                      </button>

                      <button class="recipe-action-btn" type="button">●</button>
                    </div>
                  </div>

                  <div class="recipe-tabs">
                    <button
                      class="tab-btn"
                      data-tab="ingredients"
                      type="button"
                    >
                      <span class="tab-icon"> ☷ </span>

                      Ingredients
                    </button>

                    <button
                      class="tab-btn"
                      data-tab="instructions"
                      type="button"
                    >
                      <span class="tab-icon"> ▤ </span>

                      Instructions
                    </button>

                    <button class="tab-btn" data-tab="nutrition" type="button">
                      <span class="tab-icon"> ◔ </span>

                      Nutrition
                    </button>

                    <button
                      class="tab-btn active"
                      data-tab="tips"
                      type="button"
                    >
                      <span class="tab-icon"> 💡 </span>

                      Chef's Tips
                    </button>
                  </div>

                  <div class="tab-content-area" id="tabContent"></div>
                </div>

                <div class="recipe-footer">
                  <button
                    class="another-recipe-btn"
                    id="nextRecipeBtn"
                    type="button"
                  >
                    <span> ↻ </span>

                    Try Another Recipe
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
